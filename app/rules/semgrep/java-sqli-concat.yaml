rules:
  - id: java-sqli-concat
    mode: taint
    languages: [java]
    severity: WARNING
    message: >-
      A SQL statement built by string concatenation or formatting reaches a JDBC, Spring
      JdbcTemplate or JPA query call. If any part of that string is attacker-controlled the
      query can be rewritten. Use a parameterized query (`?` placeholders or named
      parameters) instead.
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      vulnerability_type: SQL Injection
    pattern-sources:
      - pattern: '"..." + $X'
      - pattern: '$X + "..."'
      - pattern: String.format(...)
      - pattern: $SB.append(...)
    pattern-sinks:
      # Method names that only mean SQL...
      - pattern: $X.executeQuery(...)
      - pattern: $X.executeUpdate(...)
      - pattern: $X.addBatch(...)
      - pattern: $X.prepareStatement(...)
      - pattern: $X.query(...)
      - pattern: $X.queryForList(...)
      - pattern: $X.queryForObject(...)
      - pattern: $X.queryForMap(...)
      - pattern: $X.queryForRowSet(...)
      - pattern: $X.batchUpdate(...)
      - pattern: $X.createQuery(...)
      - pattern: $X.createNativeQuery(...)
      - pattern: $X.createSQLQuery(...)
      # ...and generic ones only on a known database type (MessageDigest has update() too).
      - pattern: (Statement $S).execute(...)
      - pattern: (JdbcTemplate $J).execute(...)
      - pattern: (JdbcTemplate $J).update(...)
