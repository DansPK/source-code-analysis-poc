[project]
name = "source-code-vuln-poc"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "gitpython>=3.1",
    "semgrep>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "textual>=8.2.8",
    "mcp>=1.29.0",
    "tree-sitter-language-pack<1",
]

[project.scripts]
scan = "app.main:main"
scan-api = "app.api.server:main"
ask = "app.ask:main"
scan-mcp = "app.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
artifacts = ["app/rules/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The intentionally vulnerable fixture app is data, not a test suite.
norecursedirs = ["tests/vulnerable_samples"]
