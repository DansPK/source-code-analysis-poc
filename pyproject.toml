[project]
name = "source-code-vuln-poc"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "gitpython>=3.1",
    "semgrep>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
scan = "app.main:main"
scan-api = "app.api.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The intentionally vulnerable fixture app is data, not a test suite.
norecursedirs = ["tests/vulnerable_samples"]
